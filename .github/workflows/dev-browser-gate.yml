name: Dev Browser Gate

on:
  push:
    branches:
      - dev

concurrency:
  group: dev-browser-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser_gate:
    uses: ./.github/workflows/browser-release-gate.yml
    with:
      candidate_sha: ${{ github.sha }}
    permissions:
      contents: read
